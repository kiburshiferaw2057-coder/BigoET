name: Build BINGO-ET Repository v3.2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Setup Android SDK & Build-Tools
        shell: bash
        run: |
          set -e
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ] && [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/tools/bin/sdkmanager" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-extract
            mv /tmp/cmdline-extract/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          SDKMANAGER=""
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          elif [ -x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Clean invalid non-resource README.md files in android/res
        shell: bash
        run: |
          set -e
          find android/app/src/main/res -type f -name "README.md" -delete
      - name: Validate JSON config, locales, logo/mipmap assets, and engine syntax
        shell: bash
        run: |
          set -e
          node -e '
          const fs = require("fs");
          JSON.parse(fs.readFileSync("src/config/app_config.json", "utf8"));
          JSON.parse(fs.readFileSync("src/i18n/translations.json", "utf8"));
          const requiredAssets = [
            "src/assets/bingo-et-logo.png",
            "android/app/src/main/res/drawable/ic_bingo_et_logo.png",
            "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"
          ];
          for (const p of requiredAssets) {
            if (!fs.existsSync(p)) {
              throw new Error("Missing asset: " + p);
            }
          }
          require("./src/game/bingoEngineV2.js");
          require("./src/payments/paymentConfigService.js");
          console.log("All modules, logo/mipmap assets, and configs valid.");
          '
      - name: Build Android Debug APK
        shell: bash
        run: |
          set -e
          cd android
          if [ -x "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bingo-et-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
