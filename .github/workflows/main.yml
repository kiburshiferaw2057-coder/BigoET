name: Build BINGO-ET APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-and-build:
    name: verify-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify repository structure
        run: |
          echo "=== Root files ==="
          ls -la
          echo "=== App module files ==="
          ls -la app/ || true
          echo "=== Layouts ==="
          find app/src/main/res -maxdepth 3 2>/dev/null || true
          test -f gradlew || (echo "ERROR: gradlew missing" && exit 1)
          test -d app/src/main || (echo "ERROR: app/src/main missing" && exit 1)

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Full Debug APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Verify APK contents
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Built APK: $APK_PATH"
          test -f "$APK_PATH"
          unzip -l "$APK_PATH" | head -n 40

      - name: Upload BINGO-ET APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BINGO-ET-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
