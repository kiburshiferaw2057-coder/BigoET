name: Build BINGO-ET Repository v3.2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Validate JSON config, locales, logo/mipmap assets, and engine syntax
        run: |
          node -e "const fs = require('fs'); JSON.parse(fs.readFileSync('src/config/app_config.json','utf8')); JSON.parse(fs.readFileSync('src/i18n/translations.json','utf8')); if (!fs.existsSync('src/assets/bingo-et-logo.png')  !fs.existsSync('android/app/src/main/res/drawable/ic_bingo_et_logo.png')  !fs.existsSync('android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png')) throw new Error('Missing logo or mipmap assets'); require('./src/game/bingoEngineV2.js'); require('./src/payments/paymentConfigService.js'); console.log('All modules, logo/mipmap assets, and configs valid.');"
      - name: Build Android Debug APK
        run: |
          cd android && gradle assembleDebug --stacktrace
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bingo-et-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
