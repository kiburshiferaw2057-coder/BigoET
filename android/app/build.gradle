plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bingoet.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.bingoet.app"
        minSdk 24
        targetSdk 34
        versionCode 31
        versionName "3.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
